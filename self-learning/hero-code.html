<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Barkly – Error monitoring</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #dfeaf5;
        --ink: #1f2a40;
        --muted: #4d5b75;
        --accent: #f0a64a;
        --accent-ink: #1f2a40;
        --mug: #c4453a;
        --card: #ffffff;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #141b2b;
          --ink: #eef3fa;
          --muted: #a5b2c8;
          --card: #1f2a40;
        }
      }
      :root[data-theme="dark"] {
        --bg: #141b2b;
        --ink: #eef3fa;
        --muted: #a5b2c8;
        --card: #1f2a40;
      }
      *,
      *::before,
      *::after {
        box-sizing: inherit;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "DM Sans", system-ui, sans-serif;
        line-height: 1.6;
      }
      .hero {
        max-width: 1080px;
        margin: 0 auto;
        padding: 28px 24px 64px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 0;
      }
      .logo {
        font-family: "Bricolage Grotesque", system-ui, sans-serif;
        font-weight: 800;
        font-size: 1.3rem;
        letter-spacing: -0.02em;
      }
      .logo span {
        color: var(--mug);
      }
      nav a {
        color: var(--muted);
        text-decoration: none;
        font-weight: 500;
        margin-left: 24px;
      }
      nav a:hover,
      nav a:focus-visible {
        color: var(--ink);
      }
      .grid {
        flex: 1;
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        gap: 40px;
        align-items: center;
      }
      h1 {
        font-family: "Bricolage Grotesque", system-ui, sans-serif;
        font-weight: 800;
        font-size: clamp(2.4rem, 6vw, 4.4rem);
        line-height: 1.02;
        letter-spacing: -0.035em;
        margin: 0 0 20px;
      }
      p.lead {
        font-size: 1.15rem;
        color: var(--muted);
        max-width: 46ch;
        margin: 0 0 32px;
      }
      .cta {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      .btn {
        font: inherit;
        font-weight: 500;
        padding: 14px 26px;
        border-radius: 999px;
        text-decoration: none;
        border: 2px solid var(--ink);
        color: var(--ink);
        transition: transform 0.15s;
      }
      .btn.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-ink);
      }
      .btn:hover {
        transform: translateY(-2px);
      }
      .btn:focus-visible {
        outline: 3px solid var(--mug);
        outline-offset: 3px;
      }
      .art {
        display: flex;
        justify-content: center;
      }
      .art img {
        width: 100%;
        max-width: 440px;
        height: auto;
        filter: drop-shadow(0 18px 0 rgba(31, 42, 64, 0.08));
      }
      @media (max-width: 760px) {
        .grid {
          grid-template-columns: 1fr;
          text-align: left;
        }
        .art {
          order: -1;
        }
        .art img {
          max-width: 300px;
        }
        nav a {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="hero">
      <nav>
        <div class="logo">bark<span>ly</span></div>
        <div>
          <a href="#">Features</a><a href="#">Pricing</a><a href="#">Sign in</a>
        </div>
      </nav>
      <section class="grid">
        <div>
          <h1>Your code broke. Your coffee shouldn’t pay for it.</h1>
          <p class="lead">
            Barkly catches errors the moment they happen, shows you the exact
            line that failed, and tells you who should fix it. Less staring at
            logs, more finished coffee.
          </p>
          <div class="cta">
            <a class="btn primary" href="#">Start monitoring</a>
            <a class="btn" href="#">See a sample alert</a>
          </div>
        </div>
        <div class="art">
          <img
            alt="A frustrated husky bonking its head on a computer, flailing, and knocking over a red coffee mug"
            src="husky.gif"
          />
        </div>
      </section>
    </main>
  </body>
</html>
