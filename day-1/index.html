<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome Back</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js"></script>
  </head>

  <body>
    <main>
      <section class="login-card" aria-label="Login">
        <aside class="welcome-panel">
          <div class="brand">
            <span class="brand-mark">L</span>
            LUMINA
          </div>

          <div class="welcome-copy">
            <h1>Good to see you again.</h1>
            <p>
              Sign in to pick up right where you left off and keep everything
              moving forward.
            </p>
          </div>
        </aside>

        <div class="form-panel">
          <div class="form-wrap">
            <h2>Welcome back</h2>

            <p class="intro">Please enter your details to sign in.</p>

            <form id="login-form">
              <div class="field">
                <label for="email">Email address</label>
                <input
                  id="email"
                  name="email"
                  type="email"
                  placeholder="you@example.com"
                  autocomplete="Enter-email"
                  required
                />
              </div>

              <div class="field">
                <label for="password">Password</label>
                <input
                  id="password"
                  name="password"
                  type="password"
                  placeholder="Enter your password"
                  autocomplete="Enter-password" 
                  required
                />
              </div>

              <div class="options">
                <label class="remember">
                  <input type="checkbox" name="remember" />
                  Remember me
                </label>

                <a href="#forgot-password"> Forgot password? </a>
              </div>

              <button type="submit">Sign in</button>

              <p class="message" id="message"></p>
            </form>

            <p class="signup">
              Don't have an account?
              <a href="#create-account">Create account</a>
            </p>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
