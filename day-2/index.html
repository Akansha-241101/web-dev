<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Practice</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="main-content">
      <div class="container">
        <div class="left">
          <div>
            <h1>Good to see you again.</h1>
            <p>
              Sign in to pick up right where you left off and keep everything
              moving forward.
            </p>
          </div>
        </div>
        <div class="right">
          <form action="">
            <div>
              <h2>Welcome back</h2>
              <span class="line"></span>
              <p>Please enter your details to sign in.</p>
            </div>
            <form class="login-fill">
              <div class="input-field">
                <label for="email">Email address</label>
                <input
                  class="input"
                  type="email"
                  name="email"
                  id="email"
                  placeholder="Enter email"
                  autocomplete="off"
                />
              </div>
              <div class="input-field">
                <label for="password">Password</label>
                <input
                  class="input"
                  type="text"
                  name="password"
                  id="password"
                  placeholder="Enter password"
                />
              </div>
              <div class="box4">
                <div class="remember">
                  <input type="checkbox" />
                  <span>Remember me</span>
                </div>
                <div class="forgot">
                  <a href="#forgot-password">Forgot password</a>
                </div>
              </div>
              <div class="submit">
                <button class="submit-button" type="submit">Sign In</button>
              </div>
              <div>
                <p class="otherwise">Don't have an account?</p>
              </div>
              <div class="create">
                <a href="create-account.html">Create a new account</a>
              </div>
            </form>
          </form>
        </div>
      </div>
    </main>
  </body>
</html>
